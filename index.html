<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="tab.png">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>Stork Merge</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ------------------------------------------------------------------ */
        /* --- CSS: Professional Theme (Sky & Glass) --- */
        /* ------------------------------------------------------------------ */

        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: 1px solid rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-color: #ffffff;
            --accent-color: #00ff99;
            --tile-radius: 8px;
        }

        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; position: fixed;
            font-family: 'Fredoka', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            user-select: none; touch-action: none;
        }

        /* Animated Background Canvas */
        #canvas-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        /* Logo with Glow */
        #game-logo {
            margin-bottom: 15px; max-width: 140px; height: auto;
            filter: drop-shadow(0 0 10px rgba(0, 255, 153, 0.4));
            transition: transform 0.3s;
        }
        #game-logo:hover { transform: scale(1.05) rotate(2deg); }

        /* Game Header */
        #game-header {
            width: 450px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px; z-index: 10;
        }
        h1 { margin: 0; font-size: 2em; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }

        /* Glass Score Boxes */
        #score-info { display: flex; gap: 15px; }
        .score-box {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: var(--glass-border);
            padding: 8px 15px; border-radius: 12px;
            text-align: center; min-width: 70px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .score-label { font-size: 0.75em; color: #ddd; text-transform: uppercase; letter-spacing: 1px; }
        .score-value { font-weight: 700; font-size: 1.3em; color: var(--accent-color); }

        /* Restart Button */
        #restart-btn {
            padding: 10px 20px; background: linear-gradient(45deg, #00b09b, #96c93d);
            color: white; border: none; border-radius: 25px;
            font-family: 'Fredoka', sans-serif; font-weight: 600;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        #restart-btn:active { transform: scale(0.95); }

        /* Main Game Container */
        #game-container {
            background: rgba(20, 20, 35, 0.6);
            backdrop-filter: blur(10px);
            border: var(--glass-border);
            border-radius: 15px; padding: 10px;
            box-shadow: var(--glass-shadow);
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 12px; position: relative; z-index: 5;
        }

        /* Tile Styles */
        .tile {
            width: 100px; height: 100px;
            background-color: rgba(255,255,255,0.05);
            border-radius: var(--tile-radius);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5em; font-weight: 700; color: #fff;
            position: relative;
            background-size: cover; background-position: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.27), background-color 0.2s;
        }
        
        /* Pop Animation */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); filter: brightness(1.3); }
            100% { transform: scale(1); }
        }
        .tile-pop { animation: pop 0.2s ease-in-out; }

        /* Tile Colors (Fallback if images fail) */
        .tile-2 { background-color: #eee4da; color: #776e65; }
        .tile-4 { background-color: #ede0c8; color: #776e65; }
        .tile-8 { background-color: #f2b179; }
        .tile-16 { background-color: #f59563; }
        .tile-32 { background-color: #f67c5f; }
        .tile-64 { background-color: #f65e3b; }
        .tile-128 { background-color: #edcf72; box-shadow: 0 0 10px #edcf72; }
        .tile-256 { background-color: #edcc61; box-shadow: 0 0 15px #edcc61; }
        .tile-512 { background-color: #edc850; box-shadow: 0 0 20px #edc850; }
        .tile-1024 { background-color: #edc53f; box-shadow: 0 0 25px #edc53f; }
        .tile-2048 { background-color: #edc22e; box-shadow: 0 0 30px #edc22e; }

        /* Menus (Dark Glass) */
        #start-screen, #lobby-screen, #game-over-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 32, 39, 0.92);
            backdrop-filter: blur(15px);
            z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }
        .hidden { display: none !important; }

        h2 { color: var(--accent-color); font-size: 2.2em; margin-bottom: 20px; }

        /* Buttons */
        button {
            border: none; border-radius: 12px; font-weight: 700; cursor: pointer;
            font-family: 'Fredoka', sans-serif; transition: 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        
        .full-btn {
            padding: 15px 30px; font-size: 1.1em; margin: 10px; width: 260px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary { background: #ffeb3b; color: #333; }
        .btn-secondary { background: #00c6ff; color: white; }
        .btn-danger { background: #ff416c; color: white; }

        input[type="text"] {
            padding: 15px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: white; font-size: 1.2em;
            text-align: center; margin: 15px 0; outline: none; font-family: 'Fredoka', sans-serif;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: var(--accent-color); }

        /* Mobile Controls */
        #mobile-controls { display: none; margin-top: 25px; flex-shrink: 0; }
        .mobile-dpad {
            display: grid; grid-template-columns: 60px 60px 60px; gap: 8px;
            justify-content: center;
        }
        .move-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(255,255,255,0.15); color: white; font-size: 1.5em;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .move-btn:active { background: var(--accent-color); color: #000; }

        /* Responsive */
        @media (max-width: 500px) {
            #game-header { width: 90%; }
            #game-container {
                grid-template-columns: repeat(4, 75px);
                grid-template-rows: repeat(4, 75px);
                gap: 8px; padding: 8px;
            }
            .tile { width: 75px; height: 75px; font-size: 1.8em; }
            #mobile-controls { display: block; }
            #keyboard-info { display: none; }
            h1 { font-size: 1.5em; }
        }
    </style>
</head>

    <script type="module">

    <script>
        // ------------------------------------------------------------------
        // --- VISUAL EFFECTS: Particles Background ---
        // ------------------------------------------------------------------
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) particles.push(new Particle());
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();

        // ------------------------------------------------------------------
        // --- AUDIO ENGINE: Procedural Sounds (Professional) ---
        // ------------------------------------------------------------------
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSoundPro(type) {
            if (!audioCtx) initAudio();
            const now = audioCtx.currentTime;
            
            // Master Gain
            const masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // Filter for softer sound
            const filter = audioCtx.createBiquadFilter();
            filter.type = "lowpass";
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);

            if (type === 'move') {
                // Short "tick" / soft woodblock sound
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                
                filter.frequency.setValueAtTime(800, now);
                
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                
                osc.start(now);
                osc.stop(now + 0.1);
            } 
            else if (type === 'merge') {
                // "Bubble" / "Pluck" sound - Happy sound
                osc.type = 'sine';
                // Randomize slightly for variety
                const freq = 400 + Math.random() * 100;
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 2, now + 0.15); // Pitch bend up
                
                filter.frequency.setValueAtTime(1500, now);
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                
                osc.start(now);
                osc.stop(now + 0.3);
            }
            else if (type === 'gameover') {
                // Sad slide down
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(50, now + 1.5);
                
                filter.frequency.setValueAtTime(500, now);
                filter.frequency.linearRampToValueAtTime(100, now + 1.5);
                
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 1.5);
                
                osc.start(now);
                osc.stop(now + 1.5);
            }
        }

        // ------------------------------------------------------------------
        // --- GAME LOGIC ---
        // ------------------------------------------------------------------
        const GRID_SIZE = 4;
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('high-score');
        const gameContainer = document.getElementById('game-container');
        const restartButton = document.getElementById('restart-btn');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startScreen = document.getElementById('start-screen'); 
        const lobbyScreen = document.getElementById('lobby-screen');
        const playerNameInput = document.getElementById('playerNameInput');
        const startSoloBtn = document.getElementById('start-solo-btn');
        const startMultiBtn = document.getElementById('start-multi-btn');
        const hostStartBtn = document.getElementById('hostStartBtn');

        let board = [];
        let score = 0;
        let highScore = 0;
        let isGameOver = false;
        let mergeHappened = false;

        // Multiplayer Globals
        let isMultiplayer = false;
        let roomId = null;
        let playerId = null;
        let playerName = "Player";
        let isHost = false;
        let joiningInProgress = false;

        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('room')){
            roomId = urlParams.get('room');
            startSoloBtn.style.display = 'none';
            startMultiBtn.innerText = 'Join Lobby';
        }

        // Image Map
        const IMAGE_MAP = {
            2: "tile_2.png", 4: "tile_4.png", 8: "tile_8.png", 16: "tile_16.png",
            32: "tile_32.png", 64: "tile_64.png", 128: "tile_128.png", 256: "tile_256.png",
            512: "tile_512.png", 1024: "tile_1024.png", 2048: "tile_2048.png", 4096: "tile_4096.png"
        };
        function getImageUrl(value) { return IMAGE_MAP[value] || ''; }

        function loadHighScore() {
            highScore = parseInt(localStorage.getItem('storkMergeHighScore') || 0, 10);
            highScoreDisplay.textContent = highScore;
        }
        function saveHighScore() {
            localStorage.setItem('storkMergeHighScore', highScore);
        }

        function initializeGame() {
            initAudio(); // Initialize audio context
            board = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0));
            score = 0;
            isGameOver = false;
            
            gameOverScreen.classList.add('hidden');
            startScreen.classList.add('hidden');
            lobbyScreen.classList.add('hidden');
            
            document.getElementById('restart-btn').style.display = isMultiplayer ? 'none' : 'block';

            loadHighScore();
            gameContainer.innerHTML = '';
            
            // Create Grid
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.id = `tile-${r}-${c}`;
                    gameContainer.appendChild(tile);
                }
            }

            addRandomTile();
            addRandomTile();
            updateBoardUI();
        }

        function addRandomTile() {
            if (isBoardFull()) return false;
            let r, c;
            do {
                r = Math.floor(Math.random() * GRID_SIZE);
                c = Math.floor(Math.random() * GRID_SIZE);
            } while (board[r][c] !== 0);
            
            // Trigger animation for new tile
            board[r][c] = (Math.random() < 0.9) ? 2 : 4;
            const tile = document.getElementById(`tile-${r}-${c}`);
            
            // Hacky way to ensure animation plays on next render
            setTimeout(() => {
                if(tile) tile.classList.add('tile-pop');
                setTimeout(() => tile?.classList.remove('tile-pop'), 200);
            }, 50);
            
            return true;
        }

        function updateBoardUI() {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const tileElement = document.getElementById(`tile-${r}-${c}`);
                    const value = board[r][c];
                    
                    // Reset classes
                    tileElement.className = 'tile'; 
                    tileElement.style.backgroundImage = 'none';
                    tileElement.textContent = '';
                    
                    if (value !== 0) {
                        tileElement.classList.add(`tile-${value}`);
                        const imageUrl = getImageUrl(value);
                        // Check if image exists (basic check)
                        if (imageUrl) {
                             tileElement.style.backgroundImage = `url('${imageUrl}')`;
                             // If user prefers text or image fails, we can show text too, but let's stick to clean
                             if(!imageUrl) tileElement.textContent = value;
                        } else {
                            tileElement.textContent = value;
                        }
                        // Fallback text if image doesn't load handled by CSS colors mostly
                        if(tileElement.style.backgroundImage == 'none') tileElement.textContent = value;
                    }
                }
            }
            scoreDisplay.textContent = score;
            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
            }
            if (isMultiplayer) syncScore();
        }

        function slide(row) {
            let arr = row.filter(val => val !== 0);
            let zeros = Array(GRID_SIZE - arr.length).fill(0);
            return zeros.concat(arr);
        }

        function merge(row) {
            for (let i = GRID_SIZE - 1; i > 0; i--) {
                if (row[i] === row[i - 1] && row[i] !== 0) {
                    row[i] *= 2;
                    score += row[i];
                    row[i - 1] = 0;
                    mergeHappened = true;
                }
            }
            return row;
        }

        function move(direction) {
            let boardChanged = false;
            mergeHappened = false;

            // Deep copy logic simplified for brevity
            const oldBoard = JSON.stringify(board);

            if (direction === 'right') {
                for (let r = 0; r < GRID_SIZE; r++) {
                    let row = board[r];
                    row = slide(row); row = merge(row); row = slide(row);
                    board[r] = row;
                }
            } else if (direction === 'left') {
                for (let r = 0; r < GRID_SIZE; r++) {
                    let row = board[r].reverse();
                    row = slide(row); row = merge(row); row = slide(row);
                    board[r] = row.reverse();
                }
            } else if (direction === 'up') {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let col = [];
                    for(let r=0; r<GRID_SIZE; r++) col.push(board[r][c]);
                    col = col.reverse(); col = slide(col); col = merge(col); col = slide(col); col = col.reverse();
                    for(let r=0; r<GRID_SIZE; r++) board[r][c] = col[r];
                }
            } else if (direction === 'down') {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let col = [];
                    for(let r=0; r<GRID_SIZE; r++) col.push(board[r][c]);
                    col = slide(col); col = merge(col); col = slide(col);
                    for(let r=0; r<GRID_SIZE; r++) board[r][c] = col[r];
                }
            }

            if (JSON.stringify(board) !== oldBoard) boardChanged = true;

            if (boardChanged) {
                playSoundPro(mergeHappened ? 'merge' : 'move');
                addRandomTile();
                updateBoardUI();
                checkGameOver();
            }
        }

        function isBoardFull() {
            for(let r=0;r<GRID_SIZE;r++)
                for(let c=0;c<GRID_SIZE;c++)
                    if(board[r][c]===0) return false;
            return true;
        }
        function hasMoves() {
            for(let r=0;r<GRID_SIZE;r++)
                for(let c=0;c<GRID_SIZE-1;c++)
                    if(board[r][c]===board[r][c+1]) return true;
            for(let c=0;c<GRID_SIZE;c++)
                for(let r=0;r<GRID_SIZE-1;r++)
                    if(board[r][c]===board[r+1][c]) return true;
            return false;
        }

        function checkGameOver() {
            if (isBoardFull() && !hasMoves()) {
                isGameOver = true;
                if (score > parseInt(localStorage.getItem('storkMergeHighScore') || 0)) saveHighScore();
                
                document.getElementById('final-score-value').textContent = score;
                document.getElementById('final-high-score-value').textContent = highScore; 

                if (isMultiplayer) {
                    document.getElementById('gameOverTitle').innerText = "Finished";
                    document.getElementById('multiplayer-results').style.display = 'block';
                    if (window.dbUpdate && roomId && playerId) {
                        window.dbUpdate(window.dbRef(window.db, `rooms/${roomId}/players/${playerId}`), { score: score, isDead: true });
                    }
                    fetchLeaderboard(); 
                } else {
                    document.getElementById('gameOverTitle').innerText = "Game Over";
                    document.getElementById('multiplayer-results').style.display = 'none';
                }

                gameOverScreen.classList.remove('hidden');
                playSoundPro('gameover'); 
            }
        }

        // --- Multiplayer Logic (Condensed) ---
        function getPlayerName(){
            let name = playerNameInput.value.trim();
            if(!name) name = "Stork_" + Math.floor(Math.random()*1000);
            return name;
        }

        async function createLobby(){
            if(joiningInProgress || !window.db) return;
            if(!playerNameInput.value.trim()){ alert("Please enter your username!"); return; }
            
            startMultiBtn.disabled = true; startMultiBtn.innerText = "Creating...";
            playerName = getPlayerName();
            playerId = 'host_' + Date.now();
            roomId = 'room_' + Math.floor(Math.random()*10000);
            isHost = true; isMultiplayer = true;

            await window.dbSet(window.dbRef(window.db, `rooms/${roomId}`), {
                status: 'lobby',
                players: { [playerId]: { name: playerName, score: 0, isHost: true, isDead: false } }
            });
            showLobbyUI(); listenToLobby(); joiningInProgress = false;
        }

        async function joinLobby(){
            if(joiningInProgress || !window.db || !roomId) return;
            if(!playerNameInput.value.trim()){ alert("Please enter your username!"); return; }

            startMultiBtn.disabled = true; startMultiBtn.innerText = "Joining...";
            playerName = getPlayerName();
            
            // Check name dupes
            const s = await window.dbGet(window.dbRef(window.db, `rooms/${roomId}/players`));
            if(s.exists() && Object.values(s.val()).some(p=>p.name === playerName)){
                alert("This name is already taken!"); startMultiBtn.disabled=false; return;
            }

            playerId = 'p_' + Date.now();
            isHost = false; isMultiplayer = true;
            await window.dbSet(window.dbRef(window.db, `rooms/${roomId}/players/${playerId}`), {
                name: playerName, score: 0, isHost: false, isDead: false
            });
            showLobbyUI(); listenToLobby(); joiningInProgress = false;
        }

        function showLobbyUI(){
            startScreen.classList.add('hidden');
            lobbyScreen.classList.remove('hidden');
            document.getElementById('shareLink').innerText = window.location.origin + window.location.pathname + '?room=' + roomId;
            if(isHost) document.getElementById('hostControls').classList.remove('hidden');
            else document.getElementById('clientStatus').classList.remove('hidden');
        }

        function listenToLobby(){
            window.dbOnValue(window.dbRef(window.db, `rooms/${roomId}`), (s) => {
                const data = s.val();
                if(!data) { if(!isGameOver) { alert("Room closed."); window.location.href = window.location.pathname; } return; }
                
                const pList = Object.values(data.players || {});
                document.getElementById('lobbyPlayerList').innerHTML = pList.map(p => `<li>${p.name} ${p.isHost?'(Host)':''}</li>`).join('');
                document.getElementById('lobby-count').innerText = `Players: ${pList.length}`;

                if(data.status === 'playing' && gameContainer.innerHTML === '') {
                    initializeGame(); fetchLeaderboard();
                }
            });
        }
        
        function syncScore(){
            if(isMultiplayer && roomId && playerId) window.dbUpdate(window.dbRef(window.db, `rooms/${roomId}/players/${playerId}`), { score: score });
        }
        function fetchLeaderboard(){
            window.dbOnValue(window.dbRef(window.db, `rooms/${roomId}/players`), (s) => {
                const p = Object.values(s.val()||{}).sort((a,b)=>b.score-a.score);
                document.getElementById('mp-results-content').innerHTML = p.map((x,i)=>
                    `<div style="display:flex;justify-content:space-between;border-bottom:1px solid #444;padding:5px;"><span>${i+1}. ${x.name} ${x.isDead?'✅ Final Score':''}</span> <span style="color:#00ff99">${x.score}</span></div>`
                ).join('');
            });
        }

        // Controls
        document.addEventListener('keyup', (e) => {
            if (isGameOver) return;
            if(['ArrowLeft','KeyA'].includes(e.code)) move('left');
            else if(['ArrowRight','KeyD'].includes(e.code)) move('right');
            else if(['ArrowUp','KeyW'].includes(e.code)) move('up');
            else if(['ArrowDown','KeyS'].includes(e.code)) move('down');
        });
        
        const mBtns = document.querySelectorAll('.move-btn');
        mBtns.forEach(btn => btn.addEventListener('click', (e) => {
             e.preventDefault();
             move(btn.dataset.direction);
        }));

        startSoloBtn.onclick = () => { isMultiplayer=false; initializeGame(); };
        startMultiBtn.onclick = () => { roomId ? joinLobby() : createLobby(); };
        hostStartBtn.onclick = () => window.dbUpdate(window.dbRef(window.db, `rooms/${roomId}`), { status: 'playing' });
        restartButton.onclick = initializeGame;
        document.getElementById('restart-game-btn').onclick = () => window.location.href = window.location.pathname;
        
        window.copyLink = () => { navigator.clipboard.writeText(document.getElementById('shareLink').innerText).then(()=>alert('Copied!')); };
        window.leaveLobby = async () => {
            if(window.db && roomId) {
                if(isHost) await window.dbRemove(window.dbRef(window.db, `rooms/${roomId}`));
                else await window.dbRemove(window.dbRef(window.db, `rooms/${roomId}/players/${playerId}`));
            }
            window.location.href = window.location.pathname;
        };

        document.getElementById('tweet-btn').onclick = () => {
             window.open(`https://x.com/intent/tweet?text=${encodeURIComponent(`I scored ${score} in Stork Merge #StorkMerge`)}`, '_blank');
        };

        loadHighScore();
    </script>
</body>
</html>
